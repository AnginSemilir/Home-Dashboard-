# Preview-only Home Assistant config. NOT for your real Home Assistant.
homeassistant:
  name: Home
  latitude: 51.5072
  longitude: -0.1276
  elevation: 20
  time_zone: Europe/London
  unit_system: metric
  currency: GBP
  country: GB
  language: en-GB
  packages: !include_dir_named packages

default_config:
frontend:
logger:
  default: warning

# Fake entities that use the real integrations' entity IDs.
panel_mock: !include mock_entities.yaml

lovelace:
  resource_mode: yaml
  resources:
    - {url: /local/community/kiosk-mode.js, type: module}
    - {url: /local/community/layout-card.js, type: module}
    - {url: /local/community/button-card.js, type: module}
    - {url: /local/community/apexcharts-card.js, type: module}
    - {url: /local/community/clock-weather-card.js, type: module}
    - {url: /local/community/calendar-card-pro.js, type: module}
  dashboards:
    wall-panel:
      mode: yaml
      filename: dashboards/wall_panel.yaml
      title: Wall panel
      icon: mdi:tablet-dashboard
      show_in_sidebar: true
