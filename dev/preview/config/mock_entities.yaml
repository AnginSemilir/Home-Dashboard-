# Mock entities impersonating the real integrations (entity ids copied from their docs/code).
sensor:
  # Octopus Energy (BottlecapDave) - serial 22l4132637, MPAN 1900026354329
  - entity_id: sensor.octopus_energy_electricity_22l4132637_1900026354329_current_demand
    name: Octopus Energy Electricity Current Demand
    state: 612
    unit: W
    device_class: power
    state_class: measurement
  - entity_id: sensor.octopus_energy_electricity_22l4132637_1900026354329_current_rate
    name: Octopus Energy Electricity Current Rate
    state: __agile_current__
    unit: GBP/kWh
    device_class: monetary
    attributes:
      tariff: E-1R-AGILE-24-10-01-C
      current_day_min_rate: 0.0512
      current_day_max_rate: 0.3845
      current_day_average_rate: 0.1822
  - entity_id: sensor.octopus_energy_electricity_22l4132637_1900026354329_next_rate
    name: Octopus Energy Electricity Next Rate
    state: 0.2101
    unit: GBP/kWh
    device_class: monetary
  - entity_id: sensor.octopus_energy_electricity_22l4132637_1900026354329_current_accumulative_consumption
    name: Octopus Energy Electricity Current Accumulative Consumption
    state: 6.42
    unit: kWh
    device_class: energy
    state_class: total
  - entity_id: sensor.octopus_energy_electricity_22l4132637_1900026354329_current_accumulative_cost
    name: Octopus Energy Electricity Current Accumulative Cost
    state: 1.38
    unit: GBP
    device_class: monetary
    state_class: total
  # Nest thermostat companion sensors
  - entity_id: sensor.hallway_temperature
    name: Hallway Temperature
    state: 20.5
    unit: "°C"
    device_class: temperature
    state_class: measurement
  - entity_id: sensor.e_niro_ev_battery_level
    name: e-Niro EV Battery Level
    state: 78
    unit: "%"
    device_class: battery
    state_class: measurement
  # Fully Kiosk Browser integration (device renamed "Wall panel")
  - entity_id: sensor.wall_panel_battery
    name: Wall panel Battery
    state: 85
    unit: "%"
    device_class: battery
  - entity_id: sensor.wall_panel_foreground_app
    name: Wall panel Foreground app
    state: de.ozerov.fully
  - entity_id: sensor.hallway_humidity
    name: Hallway Humidity
    state: 48
    unit: "%"
    device_class: humidity
    state_class: measurement

event:
  - entity_id: event.octopus_energy_electricity_22l4132637_1900026354329_current_day_rates
    name: Octopus Energy Electricity Current Day Rates
    event_type: octopus_energy_electricity_current_day_rates
    rates_day_offset: 0
    attributes:
      tariff_code: E-1R-AGILE-24-10-01-C
      mpan: "1900026354329"
      serial_number: 22L4132637
  - entity_id: event.octopus_energy_electricity_22l4132637_1900026354329_next_day_rates
    name: Octopus Energy Electricity Next Day Rates
    event_type: octopus_energy_electricity_next_day_rates
    rates_day_offset: 1
    attributes:
      tariff_code: E-1R-AGILE-24-10-01-C

  # Nest doorbell / camera events
  - entity_id: event.front_door_chime
    name: Front door Chime
    event_types: [ring]
  - entity_id: event.front_door_motion
    name: Front door Motion
    event_types: [camera_motion, camera_person, camera_sound]

button:
  - {entity_id: button.wall_panel_load_start_url, name: Wall panel Load start URL}
  - {entity_id: button.wall_panel_bring_to_foreground, name: Wall panel Bring to foreground}

switch:
  - {entity_id: switch.wall_panel_screensaver, name: Wall panel Screensaver, state: true}
  - {entity_id: switch.wall_panel_charger, name: Wall panel charger plug, state: true}

number:
  - {entity_id: number.wall_panel_screen_brightness, name: Wall panel Screen brightness, state: 180, min: 0, max: 255}

camera:
  - entity_id: camera.front_door
    name: Front door
    image: camera.jpg

climate:
  - entity_id: climate.hallway
    name: Hallway
    current_temperature: 20.5
    target_temperature: 21
    current_humidity: 48
    heating: true

weather:
  - entity_id: weather.forecast_home
    name: Forecast Home
    condition: partlycloudy
    temperature: 14.2

calendar:
  - entity_id: calendar.family
    name: Family
    events:
      - {summary: "Bin day - recycling", all_day: true}
      - {summary: "School run", start: 8.25, hours: 0.5}
      - {summary: "Dentist - Sam", start: 11.5, hours: 1, location: "High St Dental"}
      - {summary: "Swimming lessons", start: 16.75, hours: 1}
      - {summary: "Dinner with Alex & Jo", start: 19.5, hours: 2.5}
      - {summary: "Parkrun", start: 9, hours: 1, day: 1}
