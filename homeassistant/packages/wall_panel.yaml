# Wall panel extras: OPTIONAL automations for the Lenovo M10 panel.
#
# Needs:
#   - Fully Kiosk Browser PLUS on the tablet with Remote Administration on, and the
#     "Fully Kiosk Browser" integration added in Home Assistant with the device renamed
#     to "Wall panel" (so its entities are button.wall_panel_..., sensor.wall_panel_...).
#   - Packages enabled in configuration.yaml:
#       homeassistant:
#         packages: !include_dir_named packages
#     then copy this file to /config/packages/wall_panel.yaml and restart.
#
# Every automation checks that the entities it uses exist, so anything you don't have
# (e.g. a doorbell or a smart plug for the charger) simply does nothing.
# Edit the entity IDs marked "EDIT" if yours differ.

automation:
  # Reload the dashboard every night. This clears slow memory growth in the chart card
  # and any camera stream that has frozen.
  - id: wall_panel_nightly_refresh
    alias: "Wall panel: nightly refresh"
    triggers:
      - trigger: time
        at: "03:30:00"
    conditions:
      - condition: template
        value_template: "{{ has_value('button.wall_panel_load_start_url') }}"
    actions:
      - action: button.press
        target:
          entity_id: button.wall_panel_load_start_url

  # If someone taps Home / Spotify / Claude and walks away, bring the dashboard back after
  # 10 minutes. Music keeps playing in the background.
  - id: wall_panel_back_to_dashboard
    alias: "Wall panel: back to the dashboard after 10 minutes"
    triggers:
      - trigger: state
        entity_id: sensor.wall_panel_foreground_app
        not_to: ["de.ozerov.fully", "unavailable", "unknown"]
        for: "00:10:00"
    actions:
      - action: button.press
        target:
          entity_id: button.wall_panel_bring_to_foreground

  # Dim at night, brighten in the morning (brightness is 0-255).
  - id: wall_panel_brightness_schedule
    alias: "Wall panel: dim at night"
    triggers:
      - trigger: time
        at: "22:30:00"
        id: night
      - trigger: time
        at: "06:30:00"
        id: day
    conditions:
      - condition: template
        value_template: "{{ has_value('number.wall_panel_screen_brightness') }}"
    actions:
      - action: number.set_value
        target:
          entity_id: number.wall_panel_screen_brightness
        data:
          value: "{{ 20 if trigger.id == 'night' else 180 }}"

  # Doorbell press, or a person seen by the camera: wake the panel so the live view shows.
  - id: wall_panel_wake_on_doorbell
    alias: "Wall panel: wake on doorbell or person"
    triggers:
      # Event entities change state on every event. Ignore only "unavailable" (the
      # integration reconnecting): a doorbell that has never rung is "unknown", and its
      # first ring must still count.
      - trigger: state
        entity_id: event.front_door_chime # EDIT: your Nest doorbell's event entity
        not_from: unavailable
      - trigger: state
        entity_id: event.front_door_motion # EDIT: your Nest camera's motion event entity
        not_from: unavailable
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.to_state.attributes.get('event_type') in ['ring', 'camera_person']
             and has_value('switch.wall_panel_screensaver') }}
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.wall_panel_screensaver
      - action: button.press
        target:
          entity_id: button.wall_panel_bring_to_foreground
    mode: single

  # Only if the tablet's charger is on a smart plug (and your M10 has no Lenovo
  # "Battery protection"): keep the battery between 30% and 80%.
  - id: wall_panel_charger
    alias: "Wall panel: keep battery 30-80%"
    triggers:
      - trigger: numeric_state
        entity_id: sensor.wall_panel_battery
        below: 30
        id: charge
      - trigger: numeric_state
        entity_id: sensor.wall_panel_battery
        above: 80
        id: stop
    conditions:
      - condition: template
        value_template: "{{ has_value('switch.wall_panel_charger') }}" # EDIT: your plug's switch
    actions:
      - action: "switch.turn_{{ 'on' if trigger.id == 'charge' else 'off' }}"
        target:
          entity_id: switch.wall_panel_charger
    mode: single
